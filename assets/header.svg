<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="t d">
  <title id="t">Gavio — one level down</title>
  <desc id="d">Four layers of a stack, from web apps down to the wire: Laravel and React, Docker and Linux, C, and network security. A cursor steps down through them.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .muted { fill: #9397ab; }
    .text { fill: #e9e9ed; }
    .accent { fill: #b5abfc; }
    .small { font-size: 13px; }
    .row { font-size: 14px; }
    .cursor { animation: descend 14s cubic-bezier(.6, 0, .2, 1) infinite; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes descend {
      0%, 19%   { transform: translateY(0); }
      25%, 44%  { transform: translateY(34px); }
      50%, 69%  { transform: translateY(68px); }
      75%, 94%  { transform: translateY(102px); }
      100%      { transform: translateY(0); }
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .caret { animation: none; }
    }
  </style>

  <rect x="0.5" y="0.5" width="839" height="319" rx="12" fill="#161826" stroke="#3f424d"/>

  <text x="40" y="44" class="small muted">~/gvnlnz</text>
  <text x="800" y="44" class="small muted" text-anchor="end">Ferrara, IT</text>

  <text x="40" y="96" class="text" font-size="34" font-weight="700">Gavio</text>
  <text x="40" y="126" class="muted" font-size="15">full-stack developer, usually found <tspan class="accent">one level down</tspan><tspan class="accent caret">_</tspan></text>

  <!-- depth rail -->
  <line x1="60" y1="172" x2="60" y2="274" stroke="#3f424d" stroke-width="2"/>
  <g fill="#595d6c">
    <circle cx="60" cy="172" r="3"/>
    <circle cx="60" cy="206" r="3"/>
    <circle cx="60" cy="240" r="3"/>
    <circle cx="60" cy="274" r="3"/>
  </g>

  <!-- moving cursor: row highlight + marker -->
  <g class="cursor">
    <rect x="40" y="155" width="760" height="34" rx="6" fill="#9184d9" opacity="0.14"/>
    <circle cx="60" cy="172" r="5" fill="#b5abfc"/>
  </g>

  <g class="row">
    <text x="104" y="177" class="muted" text-anchor="end">0</text>
    <text x="130" y="177" class="text" font-weight="700">web</text>
    <text x="250" y="177" class="muted">Laravel · React · MySQL — what I ship</text>

    <text x="104" y="211" class="muted" text-anchor="end">-1</text>
    <text x="130" y="211" class="text" font-weight="700">systems</text>
    <text x="250" y="211" class="muted">Docker · Linux · Bash — where it runs</text>

    <text x="104" y="245" class="muted" text-anchor="end">-2</text>
    <text x="130" y="245" class="text" font-weight="700">C</text>
    <text x="250" y="245" class="muted">a Redis clone, a file compressor, libc from scratch</text>

    <text x="104" y="279" class="muted" text-anchor="end">-3</text>
    <text x="130" y="279" class="text" font-weight="700">wire</text>
    <text x="250" y="279" class="muted">Burp Suite · Wireshark · Python exploits</text>
  </g>
</svg>
